apiVersion: apps/v1
kind: Deployment
metadata:
  name: csharp-web
  labels:
    app: csharp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csharp-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: csharp-web
    spec:
      containers:
      - name: csharp-web
        image: csharp-web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"