security:
    password_hashers:
        App\Entity\Gestionnaire:
            algorithm: auto

    providers:
        gestionnaire_provider:
            entity:
                class: App\Entity\Gestionnaire
                property: login

    firewalls:
        main:
            lazy: true
            provider: gestionnaire_provider
            form_login:
                login_path: login
                check_path: login
                default_target_path: dashboard
            logout:
                path: logout
                target: login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_GESTIONNAIRE }
